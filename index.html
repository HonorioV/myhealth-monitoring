:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#15343b;background:#f4f8f8}*{box-sizing:border-box}body{margin:0}header{background:#087e79;color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}h1{font-size:24px;margin:0}header h1:before{content:'';display:inline-block;width:34px;height:34px;background:url(icon.png) center/cover;border-radius:8px;vertical-align:middle;margin-right:10px}header p{margin:5px 0 0;opacity:.9}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.profile-name{text-align:right;max-width:42%;overflow-wrap:anywhere;font-size:14px;font-weight:700}.profile-name small{display:block;font-size:10px;font-weight:400;opacity:.85}.tabs button{padding:8px 10px;font-size:12px}.stat small{display:block;color:#60787b;font-size:11px;margin-top:7px}.wrap{max-width:800px;margin:auto;padding:16px 16px 90px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0;position:sticky;top:0;background:#f4f8f8;z-index:2}.tabs button{white-space:nowrap;background:white;color:#16545b;border:1px solid #d7e5e5}.tabs button.active{background:#087e79;color:white}.card{background:white;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #113d4210}h2{margin:0 0 12px;font-size:20px}h3{font-size:16px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #cbdcdd;border-radius:10px;padding:11px;background:white;color:#183b40}textarea{min-height:65px}button{border:0;border-radius:10px;padding:11px 15px;background:#087e79;color:white;font-weight:650;cursor:pointer}.muted{color:#60787b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#eaf6f4;border-radius:12px;padding:13px}.stat strong{display:block;font-size:20px;margin-top:5px}.stat span{font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{flex-shrink:0}.secondary{background:#e4f0ef;color:#0c625e}.danger{background:#fff0ed;color:#a22d25}.entry{border-top:1px solid #e4eeee;padding:12px 0;overflow-wrap:anywhere}.entry small{color:#657e80}.hide{display:none!important}.notice{background:#fff5dc;padding:12px;border-radius:10px;font-size:13px}.error{color:#b22525}.success{color:#087e79}nav{padding-bottom:3px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:390px){.stat strong{font-size:17px}}

@media print{header,nav,button,form,.notice{display:none!important}.wrap{padding:0}.card{box-shadow:none}} </style></head><body><header><div class="header-row"><h1>MyHealth</h1><div class="profile-name"><small>Welcome,</small><span id="display-name">Your profile</span></div></div><p>Private • Offline • Your health, in your hands</p></header><div class="wrap"><nav id="tabs" class="tabs"></nav><main id="main"></main></div><script>
'use strict';const K='myhealth-v1-data',modules=['Dashboard','Blood Sugar','Blood Pressure','Weight','Exercise','Medications','Doctors','Laboratory' ,'HMO','Symptoms','Vaccinations','Emergency','Reports','Backup','Settings'];let tab='Dashboard';let data;try{data=JSON.parse(localStorage.getItem(K)||'null')}catch{}if(!data||typeof data!=='object'||!data.records)data={version:1,records:{sugar:[],bp:[],weight:[],exercise:[],medications:[],doses:[]},targetWeight:72};for(const k of ['sugar','bp','weight','exercise','medications','doses','doctors','labs','hmos','appointments','symptoms','vaccinations'])if(!Array.isArray(data.records[k]))data.records[k]=[];
if(!data.profile||typeof data.profile!=='object')data.profile={displayName:''};
const navIcons={"Dashboard": "layout-dashboard", "Blood Sugar": "droplet", "Blood Pressure": "heart-pulse", "Weight": "scale", "Exercise": "activity", "Medications": "pill", "Doctors": "stethoscope", "Laboratory": "flask-conical", "HMO": "shield-check", "Symptoms": "clipboard-list", "Vaccinations": "syringe", "Emergency": "siren", "Reports": "chart-no-axes-combined", "Backup": "cloud-download", "Settings": "settings"};
const iconPaths={"layout-dashboard": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1\"/>", "droplet": "<path d=\"M12 22a8 8 0 0 0 8-8c0-4-8-12-8-12S4 10 4 14a8 8 0 0 0 8 8z\"/>", "heart-pulse": "<path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z\"/><path d=\"M3.7 12h4l2-3 3 6 2-3h5.5\"/>", "scale": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M8 8a5 5 0 0 1 8 0M12 8l2 4\"/>", "activity": "<path d=\"M2 12h4l3-8 5 16 3-8h5\"/>", "pill": "<path d=\"m10 14 4-4M8 20a6 6 0 0 1-4-10l6-6a6 6 0 0 1 8 8l-6 6a6 6 0 0 1-4 2z\"/>", "stethoscope": "<path d=\"M6 3v6a6 6 0 0 0 12 0V3M4 3h4M16 3h4M12 15v2a4 4 0 0 0 8 0v-2\"/><circle cx=\"20\" cy=\"13\" r=\"2\"/>", "flask-conical": "<path d=\"M9 3h6M10 3v7L4 20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1l-6-10V3M7 16h10\"/>", "shield-check": "<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><path d=\"m9 12 2 2 4-4\"/>", "clipboard-list": "<rect x=\"5\" y=\"4\" width=\"14\" height=\"18\" rx=\"2\"/><rect x=\"9\" y=\"2\" width=\"6\" height=\"4\" rx=\"1\"/><path d=\"M9 11h6M9 15h6M9 19h4\"/>", "syringe": "<path d=\"m18 2 4 4M17 7l3-3M5 19l-3 3M8 16l-2-2 8-8 4 4-8 8-2-2zM11 9l4 4M6 18l-2-2\"/>", "siren": "<path d=\"M5 17h14l-1-7a6 6 0 0 0-12 0l-1 7zM3 21h18M12 2v2M3 7l2 2M21 7l-2 2\"/>", "chart-no-axes-combined": "<path d=\"M3 3v18h18M7 16l4-5 3 2 6-7M16 6h4v4\"/>", "cloud-download": "<path d=\"M7 18a5 5 0 0 1-1-10 7 7 0 0 1 13 3 4 4 0 0 1-1 7M12 12v9m-4-4 4 4 4-4\"/>", "settings": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"/>"};
function navIcon(m){return `<svg class="nav-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[navIcons[m]]||""}</svg>`}
function validReading(x,key){return Number.isFinite(Number(x[key]))&&Number(x[key])>0&&x.at&&!Number.isNaN(new Date(x.at).getTime())}
function recent(a,days){const end=new Date();const start=new Date(end);start.setHours(0,0,0,0);start.setDate(start.getDate()-(days-1));return a.filter(x=>{const d=new Date(x.at);return d>=start&&d<=end})}
function avg(a,k){const vals=a.filter(x=>validReading(x,k)).map(x=>Number(x[k]));return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null}
function sugarType(x){return x.readingType==='fasting'?'fasting':x.readingType==='nonfasting'?'nonfasting':'unknown'}
function fastingStreak(){const days=new Set(data.records.sugar.filter(x=>sugarType(x)==='fasting'&&validReading(x,'value')).map(x=>x.at.slice(0,10)));let d=new Date();d.setHours(12,0,0,0);const key=()=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!days.has(key()))d.setDate(d.getDate()-1);if(!days.has(key()))return 0;let count=0;while(days.has(key())){count++;d.setDate(d.getDate()-1)}return count}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};const id=()=>crypto.randomUUID();function save(){try{localStorage.setItem(K,JSON.stringify(data))}catch(e){alert('Unable to save. Please export your encrypted backup and check device storage.')}}function dateField(name,label,value=now()){return `<label>${label}<input name="${name}" type="datetime-local" value="${esc(value)}" required></label>`}function num(name,label,min='0',step='any',required=true){return `<label>${label}<input name="${name}" type="number" min="${min}" step="${step}" ${required?'required':''}></label>`}function notes(){return '<label>Notes (optional)<textarea name="notes" maxlength="1000"></textarea></label>'}function form(inner,type){return `<form data-type="${type}" class="card">${inner}<p><button type="submit">Save record</button></p></form>`}function list(type,render){let a=[...data.records[type]].sort((a,b)=>String(b.at||b.date||b.created||'').localeCompare(String(a.at||a.date||a.created||'')));return `<section class="card"><h2>History (${a.length})</h2>${a.length?a.map(x=>`<div class="entry row"><div>${render(x)}</div>${type!=='doses'?`<button class="secondary" data-edit="${type}" data-id="${esc(x.id)}">Edit</button>`:''}<button class="danger" data-delete="${type}" data-id="${esc(x.id)}" aria-label="Delete record">Delete</button></div>`).join(''):'<p class="muted">No records yet.</p>'}</section>`}function doseDay(){return now().slice(0,10)}function takenDose(m){return data.records.doses.find(x=>x.medicationId===m.id && String(x.at||'').slice(0,10)===doseDay())}function show(t=tab){tab=t;document.getElementById('display-name').textContent=data.profile.displayName||'Your profile';document.getElementById('tabs').innerHTML=modules.map(m=>`<button data-tab="${m}" class="${m===tab?'active':''}">${navIcon(m)}<span class="nav-label">${({Dashboard:"Home","Blood Sugar":"Sugar","Blood Pressure":"BP",Medications:"Meds",Laboratory:"Labs",Vaccinations:"Vaccines"})[m]||m}</span></button>`).join('');let h='';let r=data.records;if(t==='Dashboard'){let last=k=>[...r[k]].sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];let s=last('sugar'),b=last('bp'),w=last('weight');let total=r.exercise.filter(x=>x.at?.slice(0,10)===now().slice(0,10)).reduce((n,x)=>n+Number(x.duration||0),0);const groups=[['Fasting',r.sugar.filter(x=>sugarType(x)==='fasting')],['Non-Fasting',r.sugar.filter(x=>sugarType(x)==='nonfasting')]];const fmt=n=>n===null?'No data':n+' mg/dL';const bpAvg=(days)=>{let arr=recent(r.bp,days).filter(x=>validReading(x,'sys')&&validReading(x,'dia'));return arr.length?avg(arr,'sys')+'/'+avg(arr,'dia')+' mmHg':'No data'};h=`<section class="card"><div class="dash-heading"><h2>Health Dashboard</h2><details class="dash-help"><summary aria-label="About dashboard averages" title="About dashboard averages">ⓘ</summary><p>7-day and 30-day averages use recorded readings within those calendar-day windows. Missed days reset the fasting streak, not the history.</p></details></div><div class="grid">${groups.map(([name,items])=>`<div class="stat"><span>${name} BS</span><div class="metric-line"><small>7 days</small><strong>${fmt(avg(recent(items,7),'value'))}</strong></div><div class="metric-line"><small>30 days</small><strong>${fmt(avg(recent(items,30),'value'))}</strong></div></div>`).join('')}<div class="stat"><span>Blood Pressure</span><div class="metric-line"><small>7 days</small><strong>${bpAvg(7)}</strong></div><div class="metric-line"><small>30 days</small><strong>${bpAvg(30)}</strong></div></div><div class="stat"><span>Fasting streak</span><strong>${fastingStreak()} day${fastingStreak()===1?'':'s'}</strong><small>Consecutive fasting days</small></div><div class="stat"><span>Weight</span><strong>${w?esc(w.kg)+' kg':'—'}</strong></div><div class="stat"><span>Exercise today</span><strong>${total} min</strong></div></div>${r.sugar.some(x=>sugarType(x)==='unknown')?'<p class="muted" style="font-size:11px">Older sugar records: unclassified until edited.</p>':''}</section><section class="card"><h2>Medication Schedule</h2>${r.medications.filter(x=>x.active!==false).length?r.medications.filter(x=>x.active!==false).map(m=>`<div class="entry"><strong>${esc(m.name)}</strong> — ${esc(m.dose)}<br><small>${esc(m.time)} • ${esc(m.frequency)} • ${esc(m.instructions)}</small><p><button class="secondary" data-take="${esc(m.id)}" ${takenDose(m)?'disabled':''}>${takenDose(m)?'✓ Taken':'Mark taken now'}</button>${takenDose(m)?` <button class="secondary" data-undo="${esc(m.id)}">Undo</button>`:''}</p></div>`).join(''):'<p class="muted">Add medications to see them here.</p>'}<p class="muted">Medication times are a reference schedule, not automatic alerts. Confirm instructions with your prescriber.</p></section>`}else if(t==='Blood Sugar'){h=form(`<h2>Add Blood Sugar</h2>${num('value','Glucose (mg/dL)',1,1)}<label>Reading type<select name="readingType" required><option value="fasting">Fasting</option><option value="nonfasting">Non-Fasting</option></select></label>${dateField('at','Date and time taken')}${dateField('mealAt','Last meal date and time')}<label>What did you eat?<textarea name="food" maxlength="1000"></textarea></label>${notes()}`,'sugar')+list('sugar',x=>`<strong>${esc(x.value)} mg/dL</strong> • ${esc(sugarType(x)==='unknown'?'Unclassified':sugarType(x)==='fasting'?'Fasting':'Non-Fasting')}<br><small>${esc(x.at)} • Meal: ${esc(x.mealAt||'Not recorded')}</small><br><small>${esc(x.food)} ${esc(x.notes)}</small>`)}else if(t==='Blood Pressure'){h=form(`<h2>Add Blood Pressure</h2><div class="grid">${num('sys','Systolic (mmHg)',1,1)}${num('dia','Diastolic (mmHg)',1,1)}</div>${num('pulse','Pulse (bpm, optional)',1,1,false)}${dateField('at','Date and time taken')}${notes()}`,'bp')+list('bp',x=>`<strong>${esc(x.sys)}/${esc(x.dia)} mmHg</strong> ${x.pulse?'• '+esc(x.pulse)+' bpm':''}<br><small>${esc(x.at)} • ${esc(x.notes)}</small>`)}else if(t==='Weight'){let last=[...r.weight].sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];let delta=last?Number(last.kg)-Number(data.targetWeight):null;h=`<section class="card"><h2>Weight Goal</h2><label>Target weight (kg)<input id="target" type="number" min="1" step="0.1" value="${esc(data.targetWeight)}"></label><button id="save-target" class="secondary">Update target</button>${delta===null?'<p class="muted">Record your current weight to see progress.</p>':`<p><strong>${Math.abs(delta).toFixed(1)} kg (${(Math.abs(delta)*2.20462262).toFixed(1)} lb)</strong> ${delta>0?'to lose':delta<0?'to gain':'— target reached'}</p>`}</section>`+form(`<h2>Add Weight</h2>${num('kg','Weight (kg)',1,0.1)}${dateField('at','Date and time taken')}${notes()}`,'weight')+list('weight',x=>`<strong>${esc(x.kg)} kg</strong> (${(Number(x.kg)*2.20462262).toFixed(1)} lb)<br><small>${esc(x.at)} • ${esc(x.notes)}</small>`)}else if(t==='Exercise'){h=form(`<h2>Add Exercise</h2><label>Activity<select name="activity"><option>Walking</option><option>Resistance Training</option><option>Other</option></select></label>${dateField('at','Start date and time')}${num('duration','Duration (minutes)',1,1)}${notes()}`,'exercise')+list('exercise',x=>`<strong>${esc(x.activity)} • ${esc(x.duration)} min</strong><br><small>${esc(x.at)} • ${esc(x.notes)}</small>`)}else if(t==='Medications'){h=form(`<h2>Add Medication</h2><label>Medication name<input name="name" required maxlength="120"></label><label>Dosage (as prescribed)<input name="dose" required maxlength="120"></label><label>Scheduled time<input type="time" name="time" required></label><label>Frequency<select name="frequency"><option>Daily</option><option>Twice daily</option><option>Weekly</option><option>As needed</option><option>Other — see instructions</option></select></label><label>Instructions<textarea name="instructions" maxlength="1000"></textarea></label>`,'medications')+list('medications',x=>`<strong>${esc(x.name)} — ${esc(x.dose)}</strong><br><small>${esc(x.time)} • ${esc(x.frequency)} • ${esc(x.instructions)}</small><br><button class="secondary" data-toggle="${esc(x.id)}">${x.active===false?'Reactivate':'Deactivate'}</button>`)+list('doses',x=>`<strong>${esc(x.name)} — taken</strong><br><small>${esc(x.at)}</small>`)}else if(t==='Doctors'){h=form(`<h2>Add Doctor</h2><label>Doctor's name<input name="name" required maxlength="120"></label><label>Specialty<input name="specialty" required maxlength="100" placeholder="Cardiologist"></label><label>Hospital / Clinic<input name="clinic" maxlength="150"></label><label>Contact<input name="contact" maxlength="100"></label>${notes()}`,'doctors')+list('doctors',x=>`<strong>${esc(x.name)}</strong> — ${esc(x.specialty)}<br><small>${esc(x.clinic)} • ${esc(x.contact)} • ${esc(x.notes)}</small>`)+form(`<h2>Schedule Checkup</h2><label>Doctor<select name="doctorId" required>${r.doctors.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>${dateField('at','Appointment date and time')}<label>Purpose<input name="purpose" maxlength="200"></label>${notes()}`,'appointments')+list('appointments',x=>`<strong>${esc(r.doctors.find(d=>d.id===x.doctorId)?.name||'Doctor')}</strong><br><small>${esc(x.at)} • ${esc(x.purpose)} • ${esc(x.notes)}</small>`)}else if(t==='Laboratory'){h=form(`<h2>Add Historical Laboratory Result</h2><p class="muted">Enter the original collection date. Review values and units against your laboratory report.</p><label>Test name<input name="test" required maxlength="120" placeholder="HbA1c"></label><div class="grid">${num('value','Result',0,'any')}<label>Unit<input name="unit" required maxlength="40" placeholder="%"></label></div><label>Reference range (as printed)<input name="range" maxlength="100"></label>${dateField('at','Specimen collection date/time')}<label>Laboratory<input name="laboratory" maxlength="120"></label><label>Ordering doctor<select name="doctorId"><option value="">Not specified</option>${r.doctors.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>${notes()}`,'labs')+list('labs',x=>`<strong>${esc(x.test)}: ${esc(x.value)} ${esc(x.unit)}</strong><br><small>${esc(x.at)} • Range: ${esc(x.range||'—')} • ${esc(x.laboratory)} • ${esc(x.notes)}</small>`)+`<section class="card"><h2>Scanned documents</h2><p class="muted">Manual historical entry is available now. PDF/photo scan and offline OCR extraction will be implemented in the next iteration; do not assume automatic extraction is active.</p></section>`}else if(t==='HMO'){h=form(`<h2>Add HMO</h2><label>Provider<select name="provider"><option>Maxicare</option><option>ValuCare</option><option>Other</option></select></label><label>Plan name<input name="plan" maxlength="120"></label><label>Membership ID<input name="memberId" maxlength="100"></label><label>Valid until<input name="expiry" type="date"></label><label>Hotline<input name="contact" maxlength="100"></label>${notes()}`,'hmos')+list('hmos',x=>`<strong>${esc(x.provider)}</strong> — ${esc(x.plan)}<br><small>Membership: ${esc(x.memberId)} • Expiry: ${esc(x.expiry)} • ${esc(x.contact)}</small>`)}else if(t==='Symptoms'){h=form(`<h2>Add Symptom</h2><label>Symptom<input name="symptom" required maxlength="120"></label><label>Severity<select name="severity"><option>Mild</option><option>Moderate</option><option>Severe</option></select></label>${dateField('at','Date and time')}${num('duration','Duration (minutes, optional)',0,1,false)}${notes()}`,'symptoms')+list('symptoms',x=>`<strong>${esc(x.symptom)}</strong> • ${esc(x.severity)}<br><small>${esc(x.at)} • ${esc(x.duration||'—')} min • ${esc(x.notes)}</small>`)}else if(t==='Vaccinations'){h=form(`<h2>Add Vaccination / Preventive Care</h2><label>Vaccine or screening<input name="name" required maxlength="140"></label><label>Dose or procedure<input name="dose" maxlength="100"></label>${dateField('at','Date completed')}<label>Next due date (optional)<input name="nextDue" type="date"></label>${notes()}`,'vaccinations')+list('vaccinations',x=>`<strong>${esc(x.name)}</strong> • ${esc(x.dose)}<br><small>${esc(x.at)} • Next: ${esc(x.nextDue||'—')} • ${esc(x.notes)}</small>`)}else if(t==='Emergency'){let p=data.emergency||{};h=`<section class="card"><h2>Emergency Medical Information</h2><p class="muted">Keep iPhone Medical ID up to date too; this app is not accessible from the lock screen.</p><form id="emergency-form"><label>Emergency contact<input name="contact" value="${esc(p.contact||'')}" maxlength="160"></label><label>Emergency phone<input name="phone" type="tel" value="${esc(p.phone||'')}" maxlength="80"></label><label>Allergies<textarea name="allergies" maxlength="1000">${esc(p.allergies||'')}</textarea></label><label>Medical conditions<textarea name="conditions" maxlength="1000">${esc(p.conditions||'')}</textarea></label><label>Additional instructions<textarea name="instructions" maxlength="1000">${esc(p.instructions||'')}</textarea></label><p><button type="submit">Save emergency profile</button></p></form></section>`}else if(t==='Reports'){let sorted=k=>[...r[k]].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));let s=sorted('sugar').slice(0,10),b=sorted('bp').slice(0,10),labs=sorted('labs').slice(0,15),upcoming=sorted('appointments').filter(x=>x.at>=now()).sort((a,b)=>a.at.localeCompare(b.at));h=`<section class="card"><h2>Doctor Visit Preparation</h2><p class="muted">Preview recent readings, current medicines, laboratory history and upcoming appointments. Use Print to save as PDF on iPhone.</p><button id="print-report">Print / Save as PDF</button><h3>Current medications</h3>${r.medications.filter(x=>x.active!==false).map(x=>`<div class="entry">${esc(x.name)} • ${esc(x.dose)} • ${esc(x.time)}</div>`).join('')||'<p class="muted">None recorded</p>'}<h3>Recent glucose</h3>${s.map(x=>`<div class="entry">${esc(x.at)} — ${esc(x.value)} mg/dL</div>`).join('')||'<p class="muted">None recorded</p>'}<h3>Recent blood pressure</h3>${b.map(x=>`<div class="entry">${esc(x.at)} — ${esc(x.sys)}/${esc(x.dia)} mmHg</div>`).join('')||'<p class="muted">None recorded</p>'}<h3>Recent laboratory results</h3>${labs.map(x=>`<div class="entry">${esc(x.at)} — ${esc(x.test)}: ${esc(x.value)} ${esc(x.unit)}</div>`).join('')||'<p class="muted">None recorded</p>'}<h3>Upcoming appointments</h3>${upcoming.map(x=>`<div class="entry">${esc(x.at)} — ${esc(r.doctors.find(d=>d.id===x.doctorId)?.name||'Doctor')} • ${esc(x.purpose)}</div>`).join('')||'<p class="muted">None scheduled</p>'}</section>`}else if(t==='Settings'){h=`<section class="card"><h2>Personal Profile</h2><p class="muted">Your display name stays on this device and is included in backups. It is not published to GitHub.</p><form id="profile-form"><label>Display name<input name="displayName" maxlength="60" required value="${esc(data.profile.displayName)}" placeholder="Your name"></label><p><button type="submit">Save display name</button></p></form></section>`}else if(t==='Backup'){h=`<section class="card"><h2>Backup &amp; Restore</h2><p>Choose whether to protect this backup with a password. Unencrypted backups contain readable personal health information.</p><label><input id="encrypt-choice" type="checkbox"> Encrypt this backup with a password</label><div id="export-password" hidden><label>New backup password (12+ characters)<input id="pass" type="password" autocomplete="new-password" minlength="12"></label></div><p><button id="export">Download backup</button></p><h3>Restore backup</h3><p class="notice">Restoring replaces ALL existing records on this device. Create and safely keep a separate backup first.</p><label>Select MyHealth .json backup<input id="file" type="file" accept=".json,application/json"></label><p><button id="restore" class="secondary">Restore from backup</button></p><p id="status" class="muted"></p></section><section class="card"><h2>Export CSV</h2><p class="muted">CSV files are unencrypted. Store and share them carefully.</p><button id="csv" class="secondary">Export CSV files</button></section>`}document.getElementById('main').innerHTML=h}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}const enc=new TextEncoder();function b64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}async function key(password,salt){const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function exportBackup(pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await key(pass,salt);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(data)));download(new Blob([JSON.stringify({format:'myhealth-encrypted-v1',kdf:'PBKDF2-SHA256',iterations:310000,cipher:'AES-256-GCM',salt:b64(salt),iv:b64(iv),payload:b64(new Uint8Array(encrypted))})],{type:'application/json'}),'myhealth-backup-'+new Date().toISOString().slice(0,10)+'.json')}async function restoreBackup(file,pass){if(file.size>20*1024*1024)throw Error('Backup too large');const obj=JSON.parse(await file.text());let restored;if(obj.format==='myhealth-plain-v1'){restored=obj.data}else if(obj.format==='myhealth-encrypted-v1'&&obj.iterations===310000){if(!pass)throw Error('Password required for this encrypted backup');const k=await key(pass,unb64(obj.salt));const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},k,unb64(obj.payload));restored=JSON.parse(new TextDecoder().decode(decrypted))}else throw Error('Unsupported backup format');if(!restored||restored.version!==1||!restored.records||!['sugar','bp','weight','exercise','medications','doses'].every(k=>Array.isArray(restored.records[k])))throw Error('Invalid backup data');const snapshot=JSON.stringify(data);try{localStorage.setItem(K,JSON.stringify(restored));data=restored;if(!data.profile||typeof data.profile!=='object')data.profile={displayName:''};show('Dashboard')}catch(err){data=JSON.parse(snapshot);throw Error('Restore could not be saved: '+err.message)}}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){show(b.dataset.tab);return}if(b.dataset.edit){const type=b.dataset.edit,record=data.records[type]?.find(x=>x.id===b.dataset.id),f=[...document.querySelectorAll('form[data-type]')].find(f=>f.dataset.type===type);if(!record||!f){alert('Editing is not available for this record');return}for(const el of f.elements){if(el.name&&Object.prototype.hasOwnProperty.call(record,el.name))el.value=record[el.name]??''}f.dataset.editId=record.id;const submit=f.querySelector('[type=submit]');if(submit)submit.textContent='Save changes';f.scrollIntoView({behavior:'smooth',block:'start'});return}if(b.dataset.delete){if(confirm('Delete this record?')){data.records[b.dataset.delete]=data.records[b.dataset.delete].filter(x=>x.id!==b.dataset.id);save();show()}return}if(b.dataset.toggle){let m=data.records.medications.find(x=>x.id===b.dataset.toggle);if(m)m.active=m.active===false;save();show();return}if(b.dataset.take){let m=data.records.medications.find(x=>x.id===b.dataset.take);if(m&&!takenDose(m)){data.records.doses.push({id:id(),name:m.name,medicationId:m.id,at:now()});save();show()}return}if(b.dataset.undo){let m=data.records.medications.find(x=>x.id===b.dataset.undo);if(m){const dose=takenDose(m);if(dose&&confirm('Undo today’s Taken entry for '+m.name+' at '+m.time+'?')){data.records.doses=data.records.doses.filter(x=>x.id!==dose.id);save();show()}}return}if(b.id==='save-target'){let n=Number(document.getElementById('target').value);if(n>0&&n<1000){data.targetWeight=n;save();show()}else alert('Enter a valid target weight.')}if(b.id==='export'||b.id==='restore'){const status=document.getElementById('status');try{b.disabled=true;if(b.id==='export'){const encrypt=document.getElementById('encrypt-choice').checked,pass=document.getElementById('pass').value;if(encrypt){if(pass.length<12)throw Error('Enter a password of at least 12 characters');await exportBackup(pass)}else{download(new Blob([JSON.stringify({format:'myhealth-plain-v1',data})],{type:'application/json'}),'myhealth-plain-backup-'+new Date().toISOString().slice(0,10)+'.json')}status.textContent='Backup download started. Keep the file in a safe place.'}else{const f=document.getElementById('file').files[0];if(!f)throw Error('Select a backup file first');if(f.size>20*1024*1024)throw Error('Backup too large');const obj=JSON.parse(await f.text());let pass='';if(obj.format==='myhealth-encrypted-v1'){pass=prompt('This backup is encrypted. Enter its original password:');if(pass===null)return}else if(obj.format!=='myhealth-plain-v1')throw Error('Unsupported backup format');if(!confirm('Replace ALL existing health records with the backup? Make sure you have a separate backup first.'))return;await restoreBackup(f,pass);alert('Backup restored successfully.')}}catch(err){alert('Backup operation failed: '+err.message)}finally{b.disabled=false}}if(b.id==='print-report'){window.print();return}if(b.id==='csv'){for(const [name,items] of Object.entries(data.records)){if(!items.length)continue;const cols=[...new Set(items.flatMap(Object.keys))],q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download(new Blob([[cols.join(','),...items.map(x=>cols.map(c=>q(x[c])).join(','))].join('\r\n')],{type:'text/csv'}),'myhealth-'+name+'.csv')}}});document.addEventListener('change',e=>{if(e.target.id==='encrypt-choice'){document.getElementById('export-password').hidden=!e.target.checked}});document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();const name=String(new FormData(e.target).get('displayName')||'').trim();if(!name){alert('Enter a display name');return}data.profile.displayName=name;save();show('Settings');return}if(e.target.id==='emergency-form'){e.preventDefault();data.emergency=Object.fromEntries(new FormData(e.target).entries());save();alert('Emergency profile saved');return}let f=e.target.closest('form[data-type]');if(!f)return;e.preventDefault();const type=f.dataset.type,o=Object.fromEntries(new FormData(f).entries());if(type==='sugar'&&o.mealAt&&new Date(o.mealAt)>new Date(o.at)){alert('Last meal cannot be later than the measurement.');return}if(type==='bp'&&Number(o.dia)>Number(o.sys)){alert('Check blood pressure values.');return}if(f.dataset.editId){const existing=data.records[type].find(x=>x.id===f.dataset.editId);if(!existing){alert('Original record not found');return}Object.assign(existing,o);delete f.dataset.editId}else{if(type==='medications'){o.active=true;o.created=now()}o.id=id();data.records[type].push(o)}save();show()});show();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
